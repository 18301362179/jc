# ========== HTTPS 443端口（线上核心） ==========
server {
    listen 443 ssl http2;
    server_name www.tianjifu.com;

    # 1. 全局根路径（你的前端打包文件目录）
    root /home/guoll/web;
    index index.html index.htm;

    # 2. SSL证书配置
    ssl_certificate /home/guoll/ssl/www.tianjifu.com.pem;
    ssl_certificate_key /home/guoll/ssl/www.tianjifu.com.key;

    # 3. SSL安全加固配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 4. 核心：适配前端带/qwxt的API请求（关键改：去掉proxy_pass末尾/）
    location /qwxt/ {
        # 转发到后端服务（保留/qwxt前缀）
        proxy_pass http://127.0.0.1:8080;
        
        # 代理头部配置
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-Url $scheme://$host$request_uri;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        
        # 缓冲区配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 4 32k;
    }

    # 5. 解决Vue Router History模式刷新404问题（补充跨域头）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store" always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    }

    # 6. 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin *;
        access_log /var/log/nginx/static_access.log;
    }

    # 7. 安全配置
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 隐藏版本信息
    server_tokens off;

    # 防止恶意扫描
    location ~* (\.bak|\.old|\.orig|\.save|\.swp|~|#)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ========== HTTP 80端口重定向到HTTPS ==========
server {
    listen 80;
    server_name www.tianjifu.com;
    
    # 重定向所有HTTP请求到HTTPS
    return 301 https://$server_name$request_uri;
}